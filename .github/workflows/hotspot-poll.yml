# ปลุกเซิร์ฟเวอร์ Render (แพ็กเกจ Free หยุดเครื่องเมื่อไม่มีคนใช้) แล้วขอจุดความร้อนจาก GISTDA ทุก 30 นาที
# → เซิร์ฟเวอร์เก็บทุกจุดที่ตรวจพบลงชีตแท็บ _hotspots (สำรองรายวัน) แม้วันนั้นไม่มีใครเปิดแดชบอร์ด
# GISTDA ให้ดูย้อนหลังได้แค่ 24 ชม. ถ้าไม่มีใครขอเลยเกิน 24 ชม. จุดช่วงนั้นจะหายไปตลอดกาล
# ต่างจาก keep-awake.yml (ปลุกเฉพาะเวลาราชการ ยิง /api/data-status ซึ่งไม่ขอจุดความร้อน) ตัวนี้ทำงานตลอด 24 ชม. และขอ /api/hotspot
# ชั่วโมงเครื่อง Render: ตื่นราว 16 นาทีต่อรอบ → เพิ่มราว 250 ชม./เดือน รวมกับ keep-awake ราว 510 ชม. (โควตา Free 750 ชม.) · ถ้าใกล้เต็มให้เปลี่ยนเป็นทุก 60 นาที ('7 * * * *')
# ไม่ใช้ secret ใด ๆ (เรียก endpoint สาธารณะ /api/hotspot) · เปลี่ยนที่อยู่เว็บได้ที่ Settings → Variables → SITE_URL
# หมายเหตุ: GitHub จะปิด workflow ที่ตั้งเวลาอัตโนมัติถ้า repo ไม่มีความเคลื่อนไหว 60 วัน (กด Enable ใหม่ในแท็บ Actions)
name: hotspot-poll
on:
  schedule:
    - cron: '7,37 * * * *'   # ทุก 30 นาที (เลี่ยงนาทีที่ 0 และ 30 ที่คิวแน่น)
  workflow_dispatch:
permissions: {}
concurrency:
  group: hotspot-poll
  cancel-in-progress: true
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: ปลุกเซิร์ฟเวอร์และขอจุดความร้อน
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://pm25-dashboard-ex8l.onrender.com' }}
        run: |
          # Render Free ใช้เวลาตื่น 30–60 วินาที → ให้เวลา 90 วินาที ลองใหม่ได้ 3 ครั้ง
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/hs.json -w '%{http_code}' --max-time 90 "$SITE_URL/api/hotspot") || code=000
            echo "ครั้งที่ $i: HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -c "import json; d = json.load(open('/tmp/hs.json')); print('จุดความร้อน', d.get('count'), '· ตรวจพบล่าสุด', d.get('latest'), '· ข้อมูลค้าง' if d.get('stale') else '')"
              exit 0
            fi
            sleep 20
          done
          echo "ขอจุดความร้อนไม่สำเร็จ"; exit 1
