<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>ประเมินความเสี่ยงจากฝุ่น · สคร.7 ขอนแก่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: คอลัมน์เดียวแบบมือถือ · ประกาศความเป็นส่วนตัวมาก่อนเสมอ แล้วถามทีละขั้น (4 ขั้น) จบที่ผลประเมินบนหน้าจอ ไม่ส่ง ไม่เก็บ */
:root{
  color-scheme:light;
  --bg:#c9e0f0; --bg2:#e0efe6; --surface:#ffffff; --ink:#0f1b2d; --ink2:#3e4c62; --ink3:#5d6b80; --line:#b4c8dd;
  --shadow:0 10px 26px rgba(14,42,71,.13),0 1px 3px rgba(14,42,71,.10); --h1:#0e2a47; --h2:#1c6ed6;
  --accent:#1c6ed6; --accent-ink:#ffffff; --ok:#128a2f; --ok-ink:#ffffff; --danger:#c62828; --chip:#eef3f9; --chip-on:#dbe9fb;
  --warn-bg:#fff4e0; --warn-ink:#7a4a00; --mixer:#000000;
  --font-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-c:#0e8a00; --r-on:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3,p{margin:0}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.2;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.head{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:16px 16px 18px;box-shadow:var(--shadow)}
.head .sub{color:#d3e4fb;margin-top:6px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.logo{background:#fff;border-radius:12px;padding:6px 10px;display:flex;flex:none}
.logo img{height:38px;width:auto;display:block}
.org{font-size:13px;color:#d3e4fb;text-align:right;line-height:1.35}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 16px;font-weight:600;border:1.5px solid transparent;text-align:center;text-decoration:none;min-height:52px}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ok{background:var(--ok);color:var(--ok-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.note{font-size:13px;color:var(--ink3)}
.foot{text-align:center;font-size:12.5px;color:var(--ink3);display:flex;flex-direction:column;gap:2px;margin-top:6px}
.foot b{font-weight:600;color:var(--ink2)}

/* ประกาศความเป็นส่วนตัว (แนวเดียวกับระบบลงเวลา สคร.7) */
.notice{align-items:stretch;gap:14px;padding:22px 18px}
.ring{width:84px;height:84px;border-radius:50%;border:7px solid #3bbfee;display:grid;place-items:center;margin:0 auto;color:#1593b8;font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1}
.notice h2{text-align:center;font-size:26px;color:var(--ink2)}
.notice p,.notice li{font-size:15.5px;color:var(--ink)}
.notice ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.notice li b{font-weight:600}
.red{color:var(--danger);font-weight:600;text-align:center}

/* ขั้นตอน */
.prog{display:flex;flex-direction:column;gap:6px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);font-weight:500}
.bars{display:flex;gap:6px}.bars i{flex:1;height:6px;border-radius:3px;background:var(--line)}.bars i.on{background:var(--accent)}
.q h2{margin-bottom:2px}
.q .hint{font-size:14px;color:var(--ink3)}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.opt .t{display:flex;flex-direction:column;line-height:1.35}.opt .t small{color:var(--ink3);font-size:13px}
.opt .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.opt:has(input:checked){border-color:var(--accent);background:var(--chip-on)}
.sym{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.sym .n{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{min-width:0}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:10px;background:var(--chip);border:1.5px solid transparent;font-size:13.5px;line-height:1.25}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{min-width:0}.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:block;padding:9px 14px;border-radius:999px;background:var(--chip);border:1.5px solid var(--line);font-size:14.5px;line-height:1.3}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.grp{font-size:14px;font-weight:600;color:var(--ink2);margin-top:4px}
.flag{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.flag input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--danger)}
.flag:has(input:checked){border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.alert{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border:1.5px solid var(--danger);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px}

/* ผล */
.risk{border-radius:22px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--r-c) 82%,#000),color-mix(in srgb,var(--r-c) 58%,#000));color:var(--r-on);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.risk .k{font-size:14px;opacity:.92}
.risk .v{font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1.1}
.risk p{font-size:16px}
.meter{display:flex;gap:6px;margin-top:4px}.meter i{flex:1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--r-on) 28%,transparent)}.meter i.on{background:var(--r-on)}
ul.li{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.draft{align-self:center;background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 12px;text-align:center}
@media (max-width:380px){h1{font-size:23px}.risk .v{font-size:32px}}

.seg2,.seg3{display:grid;gap:6px}.seg2{grid-template-columns:1fr 1fr}.seg3{grid-template-columns:repeat(3,1fr)}
.seg2 label,.seg3 label{min-width:0}.seg2 input,.seg3 input{position:absolute;opacity:0;pointer-events:none}
.seg2 span,.seg3 span{display:block;text-align:center;padding:10px 6px;border-radius:10px;background:var(--chip);border:1.5px solid transparent;font-size:14px;line-height:1.3}
.seg2 input:checked+span,.seg3 input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg2 input:focus-visible+span,.seg3 input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg2) 38%);z-index:5}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;font-size:14.5px;padding:8px 2px;text-align:center;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.prog .lab{align-items:center}.prog .lab .lnk{padding:2px 0;text-decoration:none}
.loc{display:flex;flex-direction:column;gap:10px}
.loc.ok{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--chip)}
.place{display:flex;gap:8px;color:var(--ink2);font-size:14.5px}.place svg{width:20px;height:20px;flex:none;color:var(--ink3)}
.got{display:flex;gap:12px;align-items:center}.got b{display:block;font-size:17px;font-weight:600}.got span{font-size:14px;color:var(--ink2)}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
details.why summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:18px}
details.why[open] summary{margin-bottom:8px}
.chips span{padding:11px 14px}.seg2 span,.seg3 span{padding:12px 6px}.opt{padding:13px 12px}
.info{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.info p{font-size:14.5px;color:var(--ink2)}.info b{font-weight:600;color:var(--ink)}
.info ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}.info li{font-size:14.5px}

.err{color:var(--danger);font-weight:500}
</style>
</head>

/* ── เกณฑ์ประเมิน (ร่าง ต้องให้แพทย์/ทีมระบาดวิทยายืนยัน) อิงเอกสารทางการ:
   · QAP-F4: ไม่มีอาการ=ปกติ · 1 อาการ=มีความเสี่ยง · มากกว่า 1 อาการ=ต้องช่วยเหลือ
   · SCPM-P66: มีอาการทางเดินหายใจหรือหัวใจ และ PM2.5 เฉลี่ย 24 ชม. > 37.5 = อาจเป็นโรคจาก PM2.5 → พบแพทย์
   · คู่มือ: อาการ "key" ควรรีบไปพบแพทย์ · เจ็บอกรุนแรง/ขณะพักนาน >20 นาที = ฉุกเฉิน
   (ค่าฝุ่นที่ใช้ = เฉลี่ย 24 ชม. ตามเกณฑ์ SCPM-P66) */
function assess(a) {
  const count = Object.values(a.sym).reduce((s, x) => s + x.size, 0);
  const flat = GROUPS.map(g => [...a.sym[g.id]].map(i => g.items[i])).flat();
  const urgent = flat.some(it => it[1] === "urgent");
  const key = flat.some(it => it[1] === "key");
  const rc = a.sym.resp.size + a.sym.cv.size > 0, high = a.lv >= 3;
  const vul = a.age !== 1 || a.dis.size > 0 || a.oth.size > 0;
  let level = 0;
  if (count === 1 || (vul && a.lv >= 2)) level = 1;
  if (count > 1 || key || (rc && high)) level = 2;
  if (urgent) level = 3;
  return { level, count, vul, key, rc, high, urgent };
}

function getPos() {
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no({ code: 0 });
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), e => no(e), { enableHighAccuracy: false, timeout: 12000, maximumAge: 60000 });
  });
}
async function locate() {
  const fail = msg => { S.dust = { lv: null, avg: null, place: null, mode: "ask", busy: false, err: msg }; render(); };
  S.dust = { lv: null, avg: null, place: null, mode: "loc", busy: true }; render();
  let c;
  try { c = await getPos(); }
  catch (e) { return fail(e && e.code === 1 ? "ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง เปิดการอนุญาตตำแหน่งในตั้งค่าเครื่อง หรือเลือกระดับฝุ่นเองด้านล่าง" : "หาตำแหน่งของเครื่องไม่ได้ ลองอีกครั้ง หรือเลือกระดับฝุ่นเองด้านล่าง"); }
  try {
    const r = await fetch("/api/pm25/near", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lat: c.latitude, lng: c.longitude }), cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) return fail("ส่งคำขอถี่เกินไป รอสักครู่แล้วลองอีกครั้ง หรือเลือกระดับฝุ่นเองด้านล่าง");
    if (!r.ok || !j.ok) throw new Error("bad");
    if (j.empty || typeof j.avg !== "number") return fail("ยังไม่มีข้อมูลฝุ่นที่ตำแหน่งนี้ ลองใหม่ภายหลัง หรือเลือกระดับฝุ่นเองด้านล่าง");
    S.dust = { lv: lvOfAvg(j.avg), avg: j.avg, place: placeText(j.loc), mode: "loc", busy: false }; render();
  } catch (e) { fail("ดึงค่าฝุ่นไม่สำเร็จ ลองอีกครั้ง หรือเลือกระดับฝุ่นเองด้านล่าง"); }
}

function render() {
  if (S.step === 0) return notice();
  if (S.step === 3) return result();
  const n = S.step; let body = "";
  if (n === 1) {
    body = `<div class="q"><h2>ข้อมูลเบื้องต้น</h2><p class="hint">ไม่ถามชื่อหรือที่อยู่</p></div>
    <div class="grp">ช่วงอายุ</div>
    <div class="seg3">${AGE.map((a, i) => `<label><input type="radio" name="age" value="${i}" ${S.age === i ? "checked" : ""}><span>${a}</span></label>`).join("")}</div>
    <div class="grp">โรคประจำตัว (ไม่มีก็ข้ามได้)</div>
    <div class="chips">${DIS.map((v, i) => chip("data-dis", i, v, S.dis.has(i))).join("")}</div>
    <div class="grp">อื่นๆ</div>
    <div class="chips">${OTH.map((v, i) => chip("data-oth", i, v, S.oth.has(i))).join("")}</div>
    <div class="grp">ค่าฝุ่นที่คุณอยู่</div>
    <div id="dust">${dustBlock()}</div>`;
  } else {
    body = `<div class="q"><h2>ใน 7 วันที่ผ่านมา มีอาการเหล่านี้ไหม</h2><p class="hint">แต่ละระบบ เลือก "ไม่มี" หรือ "มี" แล้วติ๊กที่ตรงกับคุณ</p></div>
    ${GROUPS.map(g => `<div class="sym" data-g="${g.id}"><span class="n">${g.title}</span>
      <div class="seg2" role="radiogroup" aria-label="${g.title}"><label><input type="radio" name="on-${g.id}" value="0" ${S.on[g.id] === false ? "checked" : ""}><span>ไม่มี</span></label><label><input type="radio" name="on-${g.id}" value="1" ${S.on[g.id] ? "checked" : ""}><span>มี</span></label></div>
      <div class="chips" ${S.on[g.id] ? "" : "hidden"}>${g.items.map((it, i) => chip(`data-s="${g.id}" data-i`, i, it[0], S.sym[g.id].has(i))).join("")}</div></div>`).join("")}
    <div id="alert" class="alert" role="alert" ${S.sym.cv.has(0) ? "" : "hidden"}>เจ็บเค้นอกรุนแรงหรือเจ็บขณะพักนานเกิน 20 นาที ควรไปสถานพยาบาลทันที หรือโทร 1669</div>`;
  }
  const can = () => n === 1 ? (S.dust.lv !== null && !S.dust.busy) : GROUPS.every(g => S.on[g.id] !== undefined);
  view.innerHTML = `${bars(n)}<section class="card">${body}</section><div class="nav"><button class="btn ghost" id="back" type="button">ย้อนกลับ</button><button class="btn primary" id="next" type="button" ${can() ? "" : "disabled"}>${n === 2 ? "ดูผลประเมิน" : "ถัดไป"}</button></div>`;
  const upd = () => { $("#next").disabled = !can(); };
  const tog = (set, e, i) => { e.checked ? set.add(i) : set.delete(i); };
  $("#wipe").addEventListener("click", cleared);
  if (n === 1) {
    document.querySelectorAll('input[name="age"]').forEach(e => e.addEventListener("change", () => { S.age = +e.value; }));
    document.querySelectorAll("[data-dis]").forEach(e => e.addEventListener("change", () => tog(S.dis, e, +e.dataset.dis)));
    document.querySelectorAll("[data-oth]").forEach(e => e.addEventListener("change", () => tog(S.oth, e, +e.dataset.oth)));
    document.querySelectorAll('input[name="lv"]').forEach(e => e.addEventListener("change", () => { S.dust.lv = +e.value; S.dust.avg = null; upd(); }));
    const on = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener("click", fn); };
    on("locate", locate); on("useloc", locate);
    on("manual", () => { S.dust = { lv: null, avg: null, place: null, mode: "manual", busy: false }; render(); });
  } else {
    GROUPS.forEach(g => {
      document.querySelectorAll(`input[name="on-${g.id}"]`).forEach(e => e.addEventListener("change", () => {
        S.on[g.id] = e.value === "1";
        const box = document.querySelector(`[data-g="${g.id}"] .chips`);
        box.hidden = !S.on[g.id];
        if (!S.on[g.id]) { S.sym[g.id].clear(); box.querySelectorAll("input").forEach(x => { x.checked = false; }); $("#alert").hidden = !S.sym.cv.has(0); }
        upd();
      }));
      document.querySelectorAll(`[data-s="${g.id}"]`).forEach(e => e.addEventListener("change", () => { tog(S.sym[g.id], e, +e.dataset.i); $("#alert").hidden = !S.sym.cv.has(0); }));
    });
  }
  $("#back").addEventListener("click", () => { S.step = n === 1 ? 0 : n - 1; render(); });
  $("#next").addEventListener("click", () => { S.step = n + 1; render(); window.scrollTo({ top: 0 }); });
}

function result() {
  const r = assess({ ...S, lv: S.dust.lv }), R = RISK[r.level], L = LV[S.dust.lv];
  const names = GROUPS.map(g => [...S.sym[g.id]].map(i => g.items[i][0])).flat();
  const reasons = [];
  if (r.urgent) reasons.push("คุณมีอาการเจ็บเค้นอกรุนแรง หรือเจ็บขณะพักนานเกิน 20 นาที");
  reasons.push(r.count ? `มีอาการ ${r.count} อย่างใน 7 วันที่ผ่านมา: ${names.join(" · ")}` : "ไม่มีอาการใน 7 วันที่ผ่านมา");
  if (r.key && !r.urgent) reasons.push("มีอาการที่คู่มือแนะนำให้รีบไปพบแพทย์");
  reasons.push(r.rc && r.high ? `มีอาการหายใจหรือหัวใจ ขณะที่ฝุ่นเฉลี่ย 24 ชม. ระดับ "${L.name}" (เกิน 37.5)` : `ค่าฝุ่นเฉลี่ย 24 ชม. ระดับ "${L.name}"${S.dust.avg ? ` (${S.dust.avg.toFixed(1)} µg/m³)` : ` (${L.range} µg/m³)`}`);
  if (r.vul) reasons.push("อยู่ในกลุ่มเสี่ยง: " + [S.age === 0 ? AGE[0] : S.age === 2 ? AGE[2] : null, ...[...S.dis].map(i => DIS[i]), ...[...S.oth].map(i => OTH[i])].filter(Boolean).join(" · "));
  const base = r.vul ? L.risk : L.pub;
  const todo = r.urgent ? ["ไปสถานพยาบาลที่ใกล้ที่สุดทันที หรือโทร 1669", "อย่าขับรถเอง ถ้าเจ็บหน้าอกหรือหายใจลำบาก"]
    : r.level === 2 ? ["แจ้งเจ้าหน้าที่สาธารณสุข (รพ.สต./อสม.) หรือไปสถานบริการสาธารณสุขใกล้บ้าน", "อยู่ในห้องที่ปลอดฝุ่น", ...base]
    : r.level === 1 ? ["เฝ้าระวังอาการใกล้ชิด ถ้ามีอาการเพิ่ม ให้ไปพบเจ้าหน้าที่สาธารณสุข", ...base] : base;
  view.innerHTML = `
  <section class="risk" style="--r-c:${R.c};--r-on:${R.on}" aria-label="ผลประเมิน">
    <span class="k">ผลประเมินของคุณตอนนี้</span><span class="v">${R.name}</span><p>${R.line}</p>
    <div class="meter" aria-hidden="true">${[0, 1, 2, 3].map(i => `<i class="${i <= r.level ? "on" : ""}"></i>`).join("")}</div>
  </section>
  ${r.level >= 2 ? `<a class="btn ok" href="tel:${r.urgent ? "1669" : "1422"}">${I.phone}${r.urgent ? "โทร 1669 ทันที" : "ปรึกษาสายด่วนกรมควบคุมโรค 1422"}</a>` : ""}
  <section class="card"><h2>ควรทำอย่างไร</h2><ul class="li">${todo.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p class="note">ถ้าอาการแย่ลง หรือเป็นต่อเนื่อง ให้ไปพบแพทย์ที่โรงพยาบาลหรือ รพ.สต. ใกล้บ้าน</p></section>
  <details class="card why"><summary>ทำไมได้ผลนี้</summary><ul class="li">${reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
  ${r.level < 2 ? `<a class="btn ghost" href="tel:1422">${I.phone}ปรึกษาสายด่วนกรมควบคุมโรค 1422</a>` : ""}
  <p class="note" style="text-align:center">ผลนี้คำนวณบนเครื่องของคุณ ไม่ได้ส่งหรือบันทึกที่ไหน เป็นการคัดกรองเบื้องต้น ไม่ใช่การวินิจฉัยโรค</p>
  <button class="btn ghost" id="clear" type="button">ล้างคำตอบและออก</button>
  <p class="note" style="text-align:center">ปรับจากแบบสอบถาม SCPM-A66 และเกณฑ์ QAP-F4 / SCPM-P66 ของกระทรวงสาธารณสุข/กรมควบคุมโรค (ระดับผล: ควรเฝ้าระวัง = "มีความเสี่ยง" · ควรปรึกษาแพทย์ = "ต้องช่วยเหลือ")</p>
  ${DRAFT ? `<span class="draft">ร่างเกณฑ์ รอแพทย์ตรวจก่อนใช้จริง</span>` : ""}`;
  $("#clear").addEventListener("click", cleared);
}

function cleared() {
  S = fresh();
  view.innerHTML = `<section class="card" style="text-align:center;align-items:center"><div class="ring" style="color:var(--ok);border-color:var(--ok)" aria-hidden="true">✓</div>
    <h2>ล้างคำตอบแล้ว</h2><p style="color:var(--ink2)">ไม่มีข้อมูลของคุณเหลือในหน้านี้ ปิดหน้านี้ได้เลย หรือเริ่มประเมินใหม่</p>
    <button class="btn primary" id="again" type="button" style="width:100%">เริ่มประเมินใหม่</button></section>`;
  $("#again").addEventListener("click", notice);
  window.scrollTo({ top: 0 });
}
notice();
</script>
</body>
</html>
